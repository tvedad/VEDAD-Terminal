name: Bug report
description: Report a tool that fails or misbehaves, or a problem with the server/UI.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please do not report security issues here — see
        [SECURITY.md](../blob/main/SECURITY.md) instead.
  - type: input
    id: tool
    attributes:
      label: Affected tool or endpoint
      description: e.g. `dns`, `/api/batch`, or "the 3D globe".
      placeholder: dns
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what did you get instead?
      placeholder: |
        Running `GET /api/run/dns?q=example.com` returns ...
        I expected ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the server with `python server.py`
        2. Open ...
        3. ...
    validations:
      required: false
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.11"
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 / macOS 14 / Ubuntu 24.04
    validations:
      required: false
